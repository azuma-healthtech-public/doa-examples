org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Health-ID callback, split because the manifest needs the host and the path
# separately for the App Links intent filter. These two MUST equal the host and
# path of HEALTH_ID_REDIRECT_URI exactly, and that value must be what the Mimoto
# client registration carries - the Kotlin channel rejects any other callback.
# The domain already declares this package in its assetlinks.json.
healthIdCallbackHost=mimoto-example-app.azuma-health.tech
healthIdCallbackPath=/rn-ce/code/ce

# The account-transfer callback (variant A), same split as the Health-ID one.
# It must match TRANSFER_REDIRECT_URI in config.json exactly, and the domain's
# assetlinks.json must list this package with the certificate the build is
# signed with, or Android hands the callback to a browser instead of the app.
transferCallbackHost=doa-example-app.azuma-health.tech
transferCallbackPath=/callback/transfer
