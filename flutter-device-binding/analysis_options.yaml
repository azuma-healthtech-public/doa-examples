# Lints for the example itself. The generated client under `generated/` carries
# its own analysis_options.yaml and is excluded here so regenerated output can
# never fail this package's analysis.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - generated/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
